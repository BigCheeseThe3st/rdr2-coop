[Coop]
; Your name, shown to the other players.
Name=Player
; Yes = run the co-op server in this game: friends connect to you, nobody needs
; a separate server. Usually the player who hosts. You (and everyone) still set
; Port and Password; Server is then ignored for you.
RunServer=No
; With RunServer: ask the router to open the port (UPnP), so friends can join over
; the internet without port forwarding. No = forward UDP Port to this PC yourself.
UPnP=Yes
; With RunServer: Yes = list your game in the online server browser, so anyone
; can find it (they still need your password). Your internet address is shown
; in the list while your game runs.
Public=No
; Your game's name in the server browser (empty = "<Name>'s game").
RoomName=
; The online room list the browser reads and Public games appear in (empty =
; the mod's own list; off = home network only).
ListServer=
; The co-op server everyone connects to (the address of whoever runs it), its
; port and the room password.
Server=
Port=27460
Password=
; Yes = take the host role (your story, missions and enRage world are the one
; shared) whenever nobody else is hosting. The first player in hosts otherwise.
PreferHost=No
; Which character the others see you as (a ped model name, e.g.
; CS_charlessmith or CS_javierescuella). Empty = your own player model.
AppearAs=

[Net]
; Lower = less delay, but less smoothing over a jittery connection.
; Your position is sent this many times a second.
SendHz=30
; NPC updates per second from the host (stage 2).
WorldHz=20
; How far in the past the partner and NPCs are drawn, to smooth uneven packets.
; 50-70 on a steady connection, 100-150 if movement looks jerky.
SmoothingMs=70
; How often walking/riding targets are refreshed (ms).
RetaskMs=150
; How copies of the other game's wagons and boats follow it: glide (exact path,
; horses told their speed) or drive (an AI driver chases the real position).
VehicleMode=glide

[Keys]
; Host: start or end a mission party (invites everyone; they answer Y or N).
; It's in the co-op menu (F10 twice); set a key here for a shortcut (not F8:
; that's ScriptHookRDR2DotNet's console).
MissionParty=
; Revive a partner who is down, standing next to them.
Revive=F7
TeleportToPartner=F9
ShowStatus=F10
; Guests: the nemeses (in the host's enRage world) who hold a grudge against you.
; Where enRage runs (the host), F11 is enRage's own menu instead.
Nemeses=F11
; The co-op menu (mission party, host your own game, and the server browser:
; co-op games on your network and listed online) opens with ShowStatus pressed
; twice. Set a key here to give it its own (many keys, such as Home and F6, are
; already taken by the game).
ServerBrowser=
