[Coop]
; Your name, shown to the other players.
Name=Player
; Look for a newer version when the game starts and offer it in the co-op menu
; (F10 twice > Update; only releases signed by the mod are installed). No = never look.
UpdateCheck=Yes
; Yes = run the co-op server in this game: friends connect to you, nobody needs
; a separate server. Usually the player who hosts. You (and everyone) still set
; Port and Password; Server is then ignored for you.
RunServer=No
; With RunServer: ask the router to open the port (UPnP), so friends can join over
; the internet without port forwarding. No = forward UDP Port to this PC yourself.
UPnP=Yes
; With RunServer: Yes = list your game in the online server browser, so anyone
; can find it (they still need your password). Your internet address is shown
; in the list while your game runs.
Public=No
; Your game's name in the server browser (empty = "<Name>'s game").
RoomName=
; The online room list the browser reads and Public games appear in (empty =
; the mod's own list; off = home network only).
ListServer=
; The co-op server everyone connects to (the address of whoever runs it), its
; port and the room password.
Server=
Port=27460
Password=
; Yes = take the host role (your story, missions and enRage world are the one
; shared) whenever nobody else is hosting, and get it back if you drop out and
; rejoin within two minutes (unless the player who stood in also prefers
; hosting). The first player in hosts otherwise.
PreferHost=No
; Which character the others see you as (a ped model name, e.g.
; CS_charlessmith or CS_javierescuella). Empty = your own player model.
AppearAs=

[Visuals]
; What you see of your partners. Set one to No if it gives you trouble.
; Aiming: they raise their gun, and you see their shots (no bullets).
Aiming=Yes
; Horses: their horse stays where they leave it.
Horses=Yes
; Stance: crouching, jumping, climbing, swimming, falling.
Stance=Yes
; Carrying: bodies, hogtied people, pelts and carcasses they carry.
Carrying=Yes
; Names: their name over their head.
Names=Yes
; Wear: wet, dirty or bloody clothes.
Wear=Yes
; Emotes: sitting on benches and chairs, leaning on rails, at a campfire or bedroll
; (the waves, nods and laughs you pick are EmoteMenu, under [Convenience]).
Emotes=Yes

[Gameplay]
; The shared world. Set one to No if it gives you trouble.
; Markers: where the host's story missions start, on your map.
Markers=Yes
; MissionSteps: in a mission party, a guest at one of those markers can call
; the host over (the host presses Y).
MissionSteps=Yes
; OwnMissionsAsGuest: a guest's own story missions are blocked (only the host's
; story is shared; starting your own copy next to the host doubles everything).
; Yes lets them start anyway.
OwnMissionsAsGuest=No
; Explosions: dynamite and fire reach everyone's game.
Explosions=Yes
; Law: crimes count for the player who did them.
Law=Yes
; Doors: doors and broken things match.
Doors=Yes
; Trains: trains players drive, and ones the mod didn't know.
Trains=Yes
; MiniGames: co-op stands back while you play poker, blackjack, dominoes and the like,
; fish, take a bath, sit in the barber's chair or watch a show; partners see what you're doing.
MiniGames=Yes

[Convenience]
; Set one to No if it gives you trouble.
; Chat: in-game text chat.
Chat=Yes
; Waypoint: your partners' map waypoints show on your map.
Waypoint=Yes
; PartyList: who's in the session, their health, who's down, how far away.
PartyList=Yes
; RideDouble: sit behind a partner on their horse.
RideDouble=Yes
; Ping: a 'look here' marker your partners see on their map and in the world for 12 s (co-op menu, or [Keys] Ping).
Ping=Yes
; GiveMoney: hand a partner some of your cash, $10,000 at most (co-op menu); back to you if their game doesn't take it in 10 s.
GiveMoney=Yes
; Scoreboard: the session's kills, downs, wins and winnings (co-op menu).
Scoreboard=Yes
; Spectate: watch a partner while you're down or dead (co-op menu > Watch <name>, or TeleportToPartner's key: F9).
Spectate=Yes
; EmoteMenu: the mod's emotes (co-op menu > Emote: wave, tip your hat, point, come here, clap, laugh, yes, no),
; which your partners see. No means you don't see theirs either.
EmoteMenu=Yes

[Games]
; The mod's own games against each other, from the co-op menu (F10 twice). Set one to No if it gives you trouble.
; Cards and dice: whoever starts a table deals; others within 10 m join from the menu. Stakes come from your own cash.
; To try the tables out, HighCard=Yes here adds a sample game (everyone antes, one card each, the highest takes
; the pot); everyone at that table needs it.
; Poker: Texas hold 'em, 2 to 4 players; the stakes are the big blind, up to 50 of them to each hand.
Poker=Yes
; Blackjack: whoever opens the table deals and is the house (it loses at most 10 times the stakes per player a round).
Blackjack=Yes
; Dominoes: All Fives for 2 to 4 players; the first to 100 points takes the stakes from each of the others.
Dominoes=Yes
; Dice: liar's dice for 2 to 4 players, five dice each; the last player with dice takes the pot.
Dice=Yes
; Contests: whoever starts one from the menu runs it, and everyone within 60 m of them is in.
; Race: a horse race to the starter's map waypoint, any way or on horseback only.
Race=Yes
; Duel: a quick draw against one partner within 20 m of you (you pick who); both need it on.
Duel=Yes
; Shooting: bottles ahead of the starter, on the clock; each of you shoots your own, in your own game.
Shooting=Yes
; Hunting: the most points for animals killed in 3, 5 or 10 minutes (it keeps kills counted while Scoreboard=No).
Hunting=Yes

[Net]
; Lower = less delay, but less smoothing over a jittery connection.
; Your position is sent this many times a second.
SendHz=30
; NPC updates per second from the host (stage 2).
WorldHz=20
; How far in the past the partner and NPCs are drawn, to smooth uneven packets.
; 50-70 on a steady connection, 100-150 if movement looks jerky.
SmoothingMs=70
; How often walking/riding targets are refreshed (ms).
RetaskMs=150
; How copies of the other game's wagons and boats follow it: glide (exact path,
; horses told their speed) or drive (an AI driver chases the real position).
VehicleMode=glide

[Keys]
; Host: start or end a mission party (invites everyone; they answer Y or N).
; It's in the co-op menu (F10 twice); set a key here for a shortcut (not F8:
; that's ScriptHookRDR2DotNet's console).
MissionParty=
; Revive a partner who is down, standing next to them.
Revive=F7
; Sit behind a partner on their horse: the game's mount key (F) next to their horse does it,
; and dismounting gets you off. Set a key here to give it one of its own as well.
RideDouble=
; TeleportToPartner: while you're down or dead (and Spectate=Yes) it watches the next partner instead.
TeleportToPartner=F9
ShowStatus=F10
; The party list (top right: who's in, their health, who's down, how far and which
; way) shows for a few seconds with ShowStatus and when someone joins, leaves or
; goes down. Set a key here to keep it on screen (press it again to hide it).
PartyList=
; Chat: opens the game's keyboard; what you type goes to everyone in the session.
Chat=T
; Ping: drop a 'look here' marker where you look, up to 200 m (also in the co-op menu). Empty = menu only.
Ping=
; EmoteMenu: open the mod's emote menu (also in the co-op menu). Empty = menu only.
EmoteMenu=
; Scoreboard: show the session's scoreboard (also in the co-op menu). Empty = menu only.
Scoreboard=
; Guests: the nemeses (in the host's enRage world) who hold a grudge against you.
; Where enRage runs (the host), F11 is enRage's own menu instead.
Nemeses=F11
; The co-op menu (mission party, host your own game, and the server browser:
; co-op games on your network and listed online) opens with ShowStatus pressed
; twice. Set a key here to give it its own (many keys, such as Home and F6, are
; already taken by the game).
ServerBrowser=

[Testing]
; SendLogs: on beta builds, send your co-op logs to the developer automatically
; (addresses, server names and user folders are removed first). Asked once in
; game; Yes or No here answers it. LogsInstall= is a random id for your install.
SendLogs=
